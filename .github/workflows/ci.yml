name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"
  PYTHON_VERSION: "3.11"

permissions:
  contents: read

jobs:
  compose-validate:
    name: Validate Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create placeholder agent .env
        run: touch monolith/agents/.env
      - name: Validate docker-compose
        working-directory: monolith
        run: docker compose config --quiet

  backend-build:
    name: Build Backend + Gateway (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build monolith
        run: dotnet build -c Release monolith/backend/CV_Generator.csproj
      - name: Build gateway
        run: dotnet build -c Release monolith/gateway/ApiGateway.csproj

  frontend-build:
    name: Build Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Build
        run: npx ng build --configuration production

  agents-check:
    name: Import Check - Agents (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monolith/agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Byte-compile
        run: python -m compileall agents shared main.py
