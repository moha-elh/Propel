<div class="my-cv-shell">
  <header class="pg-band">
    <div class="pg-top">
      <div>
        <h1 class="ph-title">My Career</h1>
        <p class="ph-sub">Your canonical portfolio. Edit once, every tailored CV picks it up.</p>
      </div>
    </div>
    <nav class="pg-tabs">
      @for (t of tabs; track t.route) {
        <a [routerLink]="['/my-career', t.route]" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">{{ t.label }}</a>
      }
    </nav>
  </header>
  <div class="cv-outlet"><router-outlet></router-outlet></div>
</div>
