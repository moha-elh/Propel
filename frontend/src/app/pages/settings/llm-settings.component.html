@if (loading()) {
  <p class="ui-muted">Loading the AI model settings…</p>
} @else {
  <div class="ui-panel llm-panel">
    <div class="ui-sec-head">
      <div><h3>AI model</h3><p>The provider and model every agent uses: job extraction, CV generation, email drafts.</p></div>
    </div>
    <div class="llm-grid">
      <label class="field"><span>Provider</span>
        <app-select [ngModel]="selectedProvider()" (ngModelChange)="onProviderChange($event)">
          @for (p of providers(); track p.name) {
            <option [value]="p.name" [disabled]="!p.available">{{ p.label }}{{ p.available ? '' : ' (no API key)' }}</option>
          }
        </app-select>
      </label>
      <label class="field"><span>Model</span>
        @if (modelsLoading()) {
          <p class="ui-muted">Loading models…</p>
        } @else {
          <app-select [(ngModel)]="selectedModel">
            @if (models().length === 0) { <option value="">No models available</option> }
            @for (m of models(); track m) { <option [value]="m">{{ m }}</option> }
          </app-select>
        }
      </label>
    </div>
    @if (error()) { <p class="llm-error">{{ error() }}</p> }
    <div class="llm-actions">
      <button class="ui-btn primary" (click)="save()" [disabled]="saving() || !selectedProvider() || !selectedModel()">{{ saving() ? 'Saving…' : 'Save' }}</button>
      @if (showSuccess()) { <span class="ui-muted">Saved</span> }
      <span class="ui-muted llm-hint">Models are fetched live from the provider.</span>
    </div>
  </div>
}
