<div class="category-tree">
  <div class="tree-header">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" width="14" height="14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" />
      </svg>
      <input
        type="text"
        placeholder="Filter categories…"
        [value]="searchText"
        (input)="onSearch($event.target.value)"
      />
      <button
        type="button"
        class="tree-expand-toggle"
        (click)="toggleExpandAll()"
        [title]="allExpanded ? 'Collapse all' : 'Expand all'"
        [attr.aria-label]="allExpanded ? 'Collapse all' : 'Expand all'"
      >
        @if (!allExpanded) {
          <svg viewBox="0 0 24 24" fill="none" width="14" height="14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9l6 6 6-6" /><path d="M6 15l6 6 6-6" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" width="14" height="14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 15l6-6 6 6" /><path d="M6 9l6-6 6 6" />
          </svg>
        }
      </button>
      <button *ngIf="searchText" type="button" class="clear-search" (click)="clearSearch()">×</button>
    </div>
    <div class="tree-actions" *ngIf="selectedCount > 0">
      <span class="sel-count">{{ selectedCount }} selected</span>
      <button type="button" class="clear-sel" (click)="clearSelection()">Clear</button>
    </div>
  </div>

  <div class="tree-body">
    <div *ngIf="loading" class="tree-status">Loading…</div>
    <div *ngIf="!loading && empty" class="tree-status muted">No categories yet</div>
    <div *ngIf="!loading && !empty" class="tree-nodes">
      <app-category-tree-node
        *ngFor="let node of visibleTree()"
        [node]="node"
        [selectedIds]="displaySelected"
        [expandedIds]="displayExpanded()"
        [mode]="mode"
        [showCounts]="showCounts"
        (selectionChange)="onSelectionChange($event)"
        (expandChange)="onExpandChange($event)"
      ></app-category-tree-node>
    </div>
  </div>
</div>
