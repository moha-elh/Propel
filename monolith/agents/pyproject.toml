[project]
name = "propel-agents"
version = "2.0.0"
description = "Propel AI agents — consolidated Python sidecar"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0",
    # LLM providers
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-google-genai>=2.0.0",
    "langchain-mistralai>=0.2.0",
    "langchain-postgres>=0.0.17",
    "langgraph>=0.1.0",
    "google-genai>=1.0.0",
    # Extractor
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-multipart>=0.0.9",
    # Template / PDF
    "weasyprint>=60.0",
    "fpdf2>=2.7",
    "pypdf>=4.0",
    "pymupdf>=1.24.0",
    "minio>=7.0",
    # Optimizer
    "psycopg[binary]>=3.0",
    "langchain-text-splitters>=0.3.0",
    # Crawler
    "jobspy>=0.25",
    "pandas>=2.0",
    # Contact
    "requests>=2.31",
    # Kafka (optional)
    "confluent-kafka>=2.8.0; extra == 'kafka'",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "agents"]
