services:
  postgres:
    # pgvector image (not plain postgres) — migrations CREATE EXTENSION vector.
    image: pgvector/pgvector:pg17
    container_name: cv-monolith-db
    environment:
      - POSTGRES_DB=cv_monolith
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "${MONOLITH_DB_PORT:-5432}:5432"
    volumes:
      - monolith_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cv-network

  monolith:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv-monolith
    ports:
      - "${MONOLITH_PORT:-5000}:5000"
    environment:
      - PORT=5000
      - CONNECTION_STRING=Host=postgres;Port=5432;Database=cv_monolith;Username=postgres;Password=postgres
      # Owner identity for this single-user tool (auth removed).
      - OWNER_FIRST_NAME=${OWNER_FIRST_NAME:-Me}
      - OWNER_LAST_NAME=${OWNER_LAST_NAME:-}
      - OWNER_EMAIL=${OWNER_EMAIL:-me@localhost}
      # All AI agents live in the unified sidecar (see agents service below).
      - AGENTS_URL=http://agents:8000
      # AES key for encrypting stored Gmail OAuth tokens. Required at startup by
      # AesEncryptionService; a stable default keeps mailbox/email features from
      # 500ing. Override in .env to rotate. Must be base64 for 16/24/32 bytes.
      - GMAIL_TOKEN_ENCRYPTION_KEY=${GMAIL_TOKEN_ENCRYPTION_KEY:-nk7wPmLesdpUk1HFZ4bLllnzBqVYE0G2oOcVD/Y11Ug=}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cv-network

  api-gateway:
    build: ./gateway
    container_name: cv-api-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:${GATEWAY_PORT:-8080}"
    environment:
      - GATEWAY_HOST=${GATEWAY_HOST:-cv-api-gateway}
      - GATEWAY_PORT=${GATEWAY_PORT:-8080}
      - MONOLITH_HOST=monolith
      - MONOLITH_PORT=5000
      - FRONTEND_HOST=${FRONTEND_HOST:-localhost}
      - FRONTEND_PORT=${FRONTEND_PORT:-4200}
      # Owner identity reported to the SPA (auth removed).
      - OWNER_FIRST_NAME=${OWNER_FIRST_NAME:-Me}
      - OWNER_LAST_NAME=${OWNER_LAST_NAME:-}
      - OWNER_EMAIL=${OWNER_EMAIL:-me@localhost}
    depends_on:
      monolith:
        condition: service_started
    networks:
      - cv-network

  # AI agent sidecar (~2 GB) — all agents in one FastAPI process on :8000.
  # Target for AGENTS_URL. LLM keys come from agents/.env.
  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: cv-agents
    env_file: ./agents/.env
    environment:
      - BACKEND_BASE_URL=http://monolith:5000
      - MINIO_ENDPOINT=minio:9000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/cv_monolith
    ports: ["${AGENTS_PORT:-8000}:8000"]
    # Live source (editable install) — pick up code edits without a rebuild.
    volumes:
      - ./agents/agents:/app/agents
      - ./agents/shared:/app/shared
      - ./agents/main.py:/app/main.py
    depends_on:
      - monolith
    networks: [cv-network]

  minio:
    image: minio/minio:latest
    container_name: cv-minio
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - cv-network

  frontend:
    build: ../frontend
    container_name: cv-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    environment:
      # nginx.conf.template needs these; empty values break proxy_pass at startup.
      - GATEWAY_HOST=${GATEWAY_HOST:-cv-api-gateway}
      - GATEWAY_PORT=${GATEWAY_PORT:-8080}
      - FRONTEND_HOST=${FRONTEND_HOST:-localhost}
      - FRONTEND_PORT=${FRONTEND_PORT:-4200}
    depends_on:
      - api-gateway
    networks:
      - cv-network

volumes:
  monolith_db_data:
  minio_data:

networks:
  cv-network:
    name: ${CV_NETWORK:-cv-network}
